name: micampus_vendor
description: "MiCampus Vendor - shop, menu and order management for campus food vendors."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State Management & Routing
  get: ^4.7.3
  # UI Utilities
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  intl: ^0.20.2
  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
